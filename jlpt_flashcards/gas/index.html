<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<title>JLPT N4 암기장</title>
<style>
:root {
  --bg: #FAFAF8;
  --card: #FFFFFF;
  --line: #E6E4DE;
  --text: #1F1F1F;
  --muted: #77736B;
  --accent: #2F4A7A;
  --accent-text: #FFFFFF;
  --accent-soft: #E9EDF5;
  --ok: #2E7D4F;
  --ng: #C0392B;
  --jp: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
  --ko: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C1C1E;
    --card: #2A2A2D;
    --line: #3A3A3E;
    --text: #EDEDED;
    --muted: #9A9AA0;
    --accent: #8FA8D8;
    --accent-text: #14182A;
    --accent-soft: #2F3546;
    --ok: #5FBF85;
    --ng: #E57368;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--ko);
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 16px;
  display: flex;
  flex-direction: column;
}

.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

/* 버튼 */
.btn {
  min-height: 48px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.link { border: 0; background: none; min-height: 0; padding: 4px 0; color: var(--muted); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; }
.row > .btn { flex: 1; }

/* 홈 */
.title { margin: 24px 0 8px; font-size: 22px; font-weight: 700; text-align: center; }
.label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  flex: 1;
  min-height: 44px;
  padding: 8px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.progress-line { text-align: center; color: var(--muted); font-size: 14px; }

/* 문제 카드 */
.topbar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 20px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
}
.q {
  font-family: var(--jp);
  font-weight: 700;
  font-size: 56px;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.q.long { font-size: 40px; }
.q.xlong { font-size: 30px; }
.jp { font-family: var(--jp); }
.reading { font-family: var(--jp); color: var(--muted); font-size: 18px; }
.example { font-family: var(--jp); font-size: 18px; }
.example-ko { font-size: 15px; color: var(--muted); }

input.answer {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 18px;
}
input.answer:read-only { color: var(--muted); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* 채점 결과 */
.verdict { font-weight: 700; font-size: 18px; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.card.ok { border-color: var(--ok); }
.card.ng { border-color: var(--ng); }
.facts { width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.mine { text-decoration: line-through; color: var(--ng); }

/* 라운드 결과 */
.score { text-align: center; font-size: 32px; font-weight: 700; margin: 24px 0 4px; }
.wrong-list { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.wrong-list li { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.wrong-list li:first-child { border-top: 0; }
.wrong-list .w-disp { font-family: var(--jp); font-weight: 700; font-size: 18px; }
.wrong-list .w-read { font-family: var(--jp); color: var(--muted); font-size: 14px; }
.wrong-list .w-mean { width: 100%; font-size: 14px; }
</style>
</head>

s":["~해도","~하더라도"],"example":{"text":"雨が降っても、試合をします。","reading":"あめがふっても、しあいをします。","ko":"비가 와도 시합을 합니다."},"level":"N4"},{"id":"p0006","type":"pattern","script":"hiragana","display":"〜ば〜ほど","meanings":["~하면 ~할수록"],"example":{"text":"練習すればするほど上手になります。","reading":"れんしゅうすればするほどじょうずになります。","ko":"연습하면 할수록 능숙해집니다."},"level":"N4"},{"id":"p0007","type":"pattern","script":"kanji","display":"〜場合は","meanings":["~할 경우에는","~인 경우에는"],"example":{"text":"火事の場合は、エレベーターを使わないでください。","reading":"かじのばあいは、エレベーターをつかわないでください。","ko":"화재 시에는 엘리베이터를 사용하지 마세요."},"level":"N4"},{"id":"p0008","type":"pattern","script":"hiragana","display":"〜なければならない","meanings":["~해야 한다","~하지 않으면 안 된다"],"example":{"text":"明日までに宿題を出さなければなりません。","reading":"あしたまでにしゅくだいをださなければなりません。","ko":"내일까지 숙제를 내야 합니다."},"level":"N4"},{"id":"p0009","type":"pattern","script":"hiragana","display":"〜なくてはいけない","meanings":["~해야 한다","~하지 않으면 안 된다"],"example":{"text":"毎日薬を飲まなくてはいけません。","reading":"まいにちくすりをのまなくてはいけません。","ko":"매일 약을 먹어야 합니다."},"level":"N4"},{"id":"p0010","type":"pattern","script":"hiragana","display":"〜なくてもいい","meanings":["~하지 않아도 된다"],"example":{"text":"明日は来なくてもいいです。","reading":"あしたはこなくてもいいです。","ko":"내일은 오지 않아도 됩니다."},"level":"N4"},{"id":"p0011","type":"pattern","script":"hiragana","display":"〜てもかまわない","meanings":["~해도 상관없다","~해도 괜찮다"],"example":{"text":"ここで写真を撮ってもかまいません。","reading":"ここでしゃしんをとってもかまいません。","ko":"여기서 사진을 찍어도 상관없습니다."},"level":"N4"},{"id":"p0012","type":"pattern","script":"hiragana","display":"〜てはいけない","meanings":["~하면 안 된다","~해서는 안 된다"],"example":{"text":"ここでたばこを吸ってはいけません。","reading":"ここでたばこをすってはいけません。","ko":"여기서 담배를 피우면 안 됩니다."},"level":"N4"},{"id":"p0013","type":"pattern","script":"hiragana","display":"〜なさい","meanings":["~하거라","~하렴","~하세요(명령)"],"example":{"text":"早く寝なさい。","reading":"はやくねなさい。","ko":"빨리 자거라."},"level":"N4"},{"id":"p0014","type":"pattern","script":"hiragana","display":"〜な(금지)","meanings":["~하지 마"],"example":{"text":"ここで泳ぐな。","reading":"ここでおよぐな。","ko":"여기서 수영하지 마."},"level":"N4"},{"id":"p0015"," :"p0025","type":"pattern","script":"hiragana","display":"〜でしょう(확인)","meanings":["~이죠","~지요"],"example":{"text":"これ、あなたの傘でしょう。","reading":"これ、あなたのかさでしょう。","ko":"이거 당신 우산이죠?"},"level":"N4"},{"id":"p0026","type":"pattern","script":"hiragana","display":"〜かな","meanings":["~일까","~려나"],"example":{"text":"明日は晴れるかな。","reading":"あしたははれるかな。","ko":"내일은 맑으려나."},"level":"N4"},{"id":"p0027","type":"pattern","script":"kanji","display":"〜と思う","meanings":["~라고 생각하다"],"example":{"text":"この映画はおもしろいと思います。","reading":"このえいがはおもしろいとおもいます。","ko":"이 영화는 재미있다고 생각합니다."},"level":"N4"},{"id":"p0028","type":"pattern","script":"hiragana","display":"〜がする","meanings":["~이 나다","~이 들다"],"example":{"text":"台所からいい匂いがします。","reading":"だいどころからいいにおいがします。","ko":"부엌에서 좋은 냄새가 납니다."},"level":"N4"},{"id":"p0029","type":"pattern","script":"kanji","display":"〜(よ)うと思う","meanings":["~하려고 생각하다","~하려고 하다"],"example":{"text":"夏休みに日本へ行こうと思います。","reading":"なつやすみににほんへいこうとおもいます。","ko":"여름 방학에 일본에 가려고 합니다."},"level":"N4"},{"id":"p0030","type":"pattern","script":"hiragana","display":"〜(よ)うとする","meanings":["~하려고 하다"],"example":{"text":"家を出ようとした時、電話が鳴りました。","reading":"いえをでようとしたとき、でんわがなりました。","ko":"집을 나서려고 할 때 전화가 울렸습니다."},"level":"N4"},{"id":"p0031","type":"pattern","script":"hiragana","display":"〜つもりだ","meanings":["~할 생각이다","~할 작정이다"],"example":{"text":"来年、大学院に入るつもりです。","reading":"らいねん、だいがくいんにはいるつもりです。","ko":"내년에 대학원에 들어갈 생각입니다."},"level":"N4"},{"id":"p0032","type":"pattern","script":"kanji","display":"〜予定だ","meanings":["~할 예정이다"],"example":{"text":"明日は友達に会う予定です。","reading":"あしたはともだちにあうよていです。","ko":"내일은 친구를 만날 예정입니다."},"level":"N4"},{"id":"p0033","type":"pattern","script":"hiragana","display":"〜ことにする","meanings":["~하기로 하다"],"example":{"text":"毎朝運動することにしました。","reading":"まいあさうんどうすることにしました。","ko":"매일 아침 운동하기로 했습니다."},"level":"N4"},{"id":"p0034","type":"pattern","script":"hiragana","display":"〜ことになる","meanings":["~하게 되다","~하기로 되다"],"example":{"text":"来月、大阪に転勤することになりました。","reading":"らいげつ、おおさかにてんきんすることになりました。","ko":"다음 달 오사카로 전근 가게 되었습니다."},"level":"N4"},{"id":"p0035","type":"pattern","script":"hiragana","display":"〜にする","meanings":["~으로 하다(선택)"],"example":{"text":"飲み物はコーヒーにします。","reading":"のみものはコーヒーにします。","ko":"음료는 커피로 하겠습니다."},"level":"N4"},{"id":"p0036","type":"pattern","script":"hiragana","display":"〜くする・〜にする","meanings":["~하게 하다"],"example":{"text":"音を小さくしてください。","reading":"おとをちいさくしてください。","ko":"소리를 작게 해 주세요."},"level":"N4"},{"id":"p0037","type":"pattern","script":"hiragana","display":"〜ようにする","meanings":["~하도록 하다","~하도록 노력하다"],"example":{"text":"毎日野菜を食べるようにしています。","reading":"まいにちやさいをたべるようにしています。","ko":"매일 채소를 먹도록 하고 있습니다."},"level":"N4"},{"id":"p0038","type":"pattern","script":"hiragana","display":"〜ようになる","meanings":["~하게 되다"],"example":{"text":"日本語が話せるようになりました。","reading":"にほんごがはなせるようになりました。","ko":"일본어를 말할 수 있게 되었습니다."},"level":"N4"},{"id":"p0039","type":"pattern","script":"hiragana","display":"〜なくなる","meanings":["~하지 않게 되다"],"example":{"text":"最近、テレビを見なくなりました。","reading":"さいきん、テレビをみなくなりました。","ko":"요즘 텔레비전을 안 보게 되었습니다."},"level":"N4"},{"id":"p0040","type":"pattern","script":"hiragana","display":"〜ように(목적)","meanings":["~하도록","~할 수 있도록"],"example":{"text":"忘れないように、メモします。","reading":"わすれないように、メモします。","ko":"잊지 않도록 메모합니다."},"level":"N4"},{"id":"p0041","type":"pattern","script":"kanji","display":"〜ように言う","meanings":["~하라고 말하다"],"example":{"text":"先生に静かにするように言われました。","reading":"せんせいにしずかにするようにいわれました。","ko":"선생님께 조용히 하라는 말을 들었습니다."},"level":"N4"},{"id":"p0042","type":"pattern","script":"hiragana","display":"〜ために","meanings":["~하기 위해","~때문에"],"example":{"text":"日本へ留学するために、お金を貯めています。","reading":"にほんへりゅうがくするために、おかねをためています。","ko":"일본에 유학하기 위해 돈을 모으고 있습니다."},"level":"N4"},{"id":"p0043","type":"pattern","script":"hiragana","display":"〜のに(역접)","meanings":["~한데도","~는데"],"example":{"text":"薬を飲んだのに、まだ熱があります。","reading":"くすりをのんだのに、まだねつがあります。","ko":"약을 먹었는데도 아직 열이 있습니다."},"level":"N4"},{"id":"p0044","type":"pattern","script":"hiragana","display":"〜のに(용도)","meanings":["~하는 데"],"example":{"text":"この箱は本を運ぶのに便利です。","reading":"このはこはほんをはこぶのにべんりです。","ko":"이 상자는 책을 나르는 데 편리합니다."},"level":"N4"},{"id":"p0045","type":"pattern","script":"hiragana","display":"〜けど","meanings":["~지만","~는데"],"example":{"text":"この服は高いけど、とてもいいです。","reading":"このふくはたかいけど、とてもいいです。","ko":"이 옷은 비싸지만 아주 좋습니다."},"level":"N4"},{"id":"p0046","type":"pattern","script":"hiragana","display":"〜ので","meanings":["~이므로","~해서","~때문에"],"example":{"text":"熱があるので、学校を休みます。","reading":"ねつがあるので、がっこうをやすみます。","ko":"열이 있어서 학교를 쉽니다."},"level":"N4"},{"id":"p0047","type":"pattern","script":"hiragana","display":"〜て(이유)","meanings":["~해서"],"example":{"text":"風邪をひいて、学校を休みました。","reading":"かぜをひいて、がっこうをやすみました。","ko":"감기에 걸려서 학교를 쉬었습니다."},"level":"N4"},{"id":"p0048","type":"pattern","script":"hiragana","display":"〜し、〜し","meanings":["~하고 ~하고","~하기도 하고"],"example":{"text":"この店は安いし、おいしいし、よく来ます。","reading":"このみせはやすいし、おいしいし、よくきます。","ko":"이 가게는 싸고 맛있어서 자주 옵니다."},"level":"N4"},{"id":"p0049","type":"pattern","script":"hiragana","display":"〜とか","meanings":["~라든가","~든지"],"example":{"text":"休みの日は映画とか買い物とかに行きます。","reading":"やすみのひはえいがとかかいものとかにいきます。","ko":"쉬는 날에는 영화라든가 쇼핑 같은 데 갑니다."},"level":"N4"},{"id":"p0050","type":"pattern","script":"hiragana","display":"〜ながら","meanings":["~하면서"],"example":{"text":"音楽を聞きながら勉強します。","reading":"おんがくをききながらべんきょうします。","ko":"음악을 들으면서 공부합니다."},"level":"N4"},{"id":"p0051","type":"pattern","script":"hiragana","display":"〜ないで","meanings":["~하지 않고","~하지 말고"],"example":{"text":"朝ご飯を食べないで学校へ行きました。","reading":"あさごはんをたべないでがっこうへいきました。","ko":"아침을 먹지 않고 학교에 갔습니다."},"level":"N4"},{"id":"p0052","type":"pattern","script":"hiragana","display":"〜ずに","meanings":["~하지 않고"],"example":{"text":"辞書を使わずに読みました。","reading":"じしょをつかわずによみました。","ko":"사전을 쓰지 않고 읽었습니다."},"level":"N4"},{"id":"p0053","type":"pattern","script":"hiragana","display":"〜まま","meanings":["~한 채로","~그대로"],"example":{"text":"電気をつけたまま寝てしまいました。","reading":"でんきをつけたままねてしまいました。","ko":"불을 켠 채로 자 버렸습니다."},"level":"N4"},{"id":"p0054","type":"pattern","script":"hiragana","display":"〜てしまう","meanings":["~해 버리다","~하고 말다"],"example":{"text":"財布を忘れてしまいました。","reading":"さいふをわすれてしまいました。","ko":"지갑을 잊어버리고 말았습니다."},"level":"N4"},{"id":"p0055","type":"pattern","script":"hiragana","display":"〜ちゃう・〜じゃう","meanings":["~해 버리다(구어)"],"example":{"text":"ケーキを全部食べちゃった。","reading":"ケーキをぜんぶたべちゃった。","ko":"케이크를 전부 먹어 버렸어."},"level":"N4"},{"id":"p0056","type":"pattern","script":"hiragana","display":"〜ておく","meanings":["~해 두다","~해 놓다"],"example":{"text":"旅行の前にホテルを予約しておきます。","reading":"りょこうのまえにホテルをよやくしておきます。","ko":"여행 전에 호텔을 예약해 둡니다."},"level":"N4"},{"id":"p0057","type":"pattern","script":"hiragana","display":"〜てある","meanings":["~해져 있다","~되어 있다"],"example":{"text":"壁に絵が掛けてあります。","reading":"かべにえがかけてあります。","ko":"벽에 그림이 걸려 있습니다."},"level":"N4"},{"id":"p0058","type":"pattern","script":"hiragana","display":"〜てみる","meanings":["~해 보다"],"example":{"text":"この服を着てみてもいいですか。","reading":"このふくをきてみてもいいですか。","ko":"이 옷을 입어 봐도 됩니까?"},"level":"N4"},{"id":"p0059","type":"pattern","script":"hiragana","display":"〜てくる","meanings":["~해 오다","~하기 시작하다"],"example":{"text":"だんだん寒くなってきました。","reading":"だんだんさむくなってきました。","ko":"점점 추워지기 시작했습니다."},"level":"N4"},{"id":"p0060","type":"pattern","script":"hiragana","display":"〜ていく","meanings":["~해 가다","~해 나가다"],"example":{"text":"これからも日本語を勉強していきます。","reading":"これからもにほんごをべんきょうしていきます。","ko":"앞으로도 일본어를 공부해 나가겠습니다."},"level":"N4"},{"id":"p0061","type":"pattern","script":"hiragana","display":"〜ところだ","meanings":["~하려던 참이다"],"example":{"text":"今から出かけるところです。","reading":"いまからでかけるところです。","ko":"지금 막 나가려던 참입니다."},"level":"N4"},{"id":"p0062","type":"pattern","script":"hiragana","display":"〜ているところだ","meanings":["~하고 있는 중이다"],"example":{"text":"今、晩ご飯を作っているところです。","reading":"いま、ばんごはんをつくっているところです。","ko":"지금 저녁밥을 만들고 있는 중입니다."},"level":"N4"},{"id":"p0063","type":"pattern","script":"hiragana","display":"〜たところだ","meanings":["막 ~했다"],"example":{"text":"今、駅に着いたところです。","reading":"いま、えきについたところです。","ko":"지금 막 역에 도착했습니다."},"level":"N4"},{"id":"p0064","type":"pattern","script":"hiragana","display":"〜たばかりだ","meanings":["~한 지 얼마 안 되다","막 ~했다"],"example":{"text":"日本に来たばかりです。","reading":"にほんにきたばかりです。","ko":"일본에 온 지 얼마 안 됐습니다."},"level":"N4"},{"id":"p0065","type":"pattern","script":"kanji","display":"〜始める","meanings":["~하기 시작하다"],"example":{"text":"去年から日本語を習い始めました。","reading":"きょねんからにほんごをならいはじめました。","ko":"작년부터 일본어를 배우기 시작했습니다."},"level":"N4"},{"id":"p0066","type":"pattern","script":"kanji","display":"〜出す","meanings":["~하기 시작하다(갑자기)"],"example":{"text":"急に雨が降り出しました。","reading":"きゅうにあめがふりだしました。","ko":"갑자기 비가 내리기 시작했습니다."},"level":"N4"},{"id":"p0067","type":"pattern","script":"kanji","display":"〜終わる","meanings":["다 ~하다","~하기를 끝내다"],"example":{"text":"この本はもう読み終わりました。","reading":"このほんはもうよみおわりました。","ko":"이 책은 벌써 다 읽었습니다."},"level":"N4"},{"id":"p0068","type":"pattern","script":"kanji","display":"〜続ける","meanings":["계속 ~하다"],"example":{"text":"一時間歩き続けました。","reading":"いちじかんあるきつづけました。","ko":"한 시간 동안 계속 걸었습니다."},"level":"N4"},{"id":"p0069","type":"pattern","script":"kanji","display":"〜間","meanings":["~하는 동안"],"example":{"text":"夏休みの間、ずっと国にいました。","reading":"なつやすみのあいだ、ずっとくににいました。","ko":"여름 방학 동안 계속 고국에 있었습니다."},"level":"N4"},{"id":"p0070","type":"pattern","script":"kanji","display":"〜間に","meanings":["~하는 동안에","~사이에"],"example":{"text":"母が寝ている間に、料理を作りました。","reading":"ははがねているあいだに、りょうりをつくりました。","ko":"어머니가 주무시는 사이에 요리를 만들었습니다."},"level":"N4"},{"id":"p0071","type":"pattern","script":"hiragana","display":"〜うちに","meanings":["~하는 동안에","~할 때"],"example":{"text":"温かいうちに食べてください。","reading":"あたたかいうちにたべてください。","ko":"따뜻할 때 드세요."},"level":"N4"},{"id":"p0072","type":"pattern","script":"hiragana","display":"〜までに","meanings":["~까지(기한)"],"example":{"text":"金曜日までにレポートを出してください。","reading":"きんようびまでにレポートをだしてください。","ko":"금요일까지 리포트를 내 주세요."},"level":"N4"},{"id":"p0073","type":"pattern","script":"hiragana","display":"〜おきに","meanings":["~걸러","~간격으로"],"example":{"text":"この電車は十分おきに来ます。","reading":"このでんしゃはじゅっぷんおきにきます。","ko":"이 전철은 10분 간격으로 옵니다."},"level":"N4"},{"id":"p0074","type":"pattern","script":"hiragana","display":"〜ことがある","meanings":["~할 때가 있다","~하는 경우가 있다"],"example":{"text":"時々、朝ご飯を食べないことがあります。","reading":"ときどき、あさごはんをたべないことがあります。","ko":"가끔 아침을 안 먹을 때가 있습니다."},"level":"N4"},{"id":"p0075","type":"pattern","script":"hiragana","display":"〜てあげる","meanings":["~해 주다"],"example":{"text":"友達に傘を貸してあげました。","reading":"ともだちにかさをかしてあげました。","ko":"친구에게 우산을 빌려주었습니다."},"level":"N4"},{"id":"p0076","type":"pattern","script":"hiragana","display":"〜てやる","meanings":["~해 주다(아랫사람·동물에게)"],"example":{"text":"弟に宿題を教えてやりました。","reading":"おとうとにしゅくだいをおしえてやりました。","ko":"남동생에게 숙제를 가르쳐 주었습니다."},"level":"N4"},{"id":"p0077","type":"pattern","script":"hiragana","display":"〜てくれる","meanings":["(남이 나에게) ~해 주다"],"example":{"text":"友達が駅まで送ってくれました。","reading":"ともだちがえきまでおくってくれました。","ko":"친구가 역까지 바래다주었습니다."},"level":"N4"},{"id":"p0078","type":"pattern","script":"hiragana","display":"〜てくださる","meanings":["~해 주시다"],"example":{"text":"先生が道を教えてくださいました。","reading":"せんせいがみちをおしえてくださいました。","ko":"선생님께서 길을 알려 주셨습니다."},"level":"N4"},{"id":"p0079","type":"pattern","script":"hiragana","display":"〜てもらう","meanings":["~해 받다","(남이) ~해 주다"],"example":{"text":"先生に作文を直してもらいました。","reading":"せんせいにさくぶんをなおしてもらいました。","ko":"선생님이 작문을 고쳐 주셨습니다."},"level":"N4"},{"id":"p0080","type":"pattern","script":"hiragana","display":"〜ていただく","meanings":["~해 받다(겸양)","~해 주시다"],"example":{"text":"先生に手紙を読んでいただきました。","reading":"せんせいにてがみをよんでいただきました。","ko":"선생님께서 편지를 읽어 주셨습니다."},"level":"N4"},{"id":"p0081","type":"pattern","script":"hiragana","display":"〜てもらえませんか","meanings":["~해 줄 수 없겠습니까"],"example":{"text":"ちょっと手伝ってもらえませんか。","reading":"ちょっとてつだってもらえませんか。","ko":"좀 도와줄 수 없을까요?"},"level":"N4"},{"id":"p0082","type":"pattern","script":"hiragana","display":"〜ていただけませんか","meanings":["~해 주실 수 없겠습니까"],"example":{"text":"もう一度説明していただけませんか。","reading":"もういちどせつめいしていただけませんか。","ko":"한 번 더 설명해 주실 수 없겠습니까?"},"level":"N4"},{"id":"p0083","type":"pattern","script":"hiragana","display":"〜てほしい","meanings":["~해 주었으면 하다","~하길 바라다"],"example":{"text":"母に元気でいてほしいです。","reading":"ははにげんきでいてほしいです。","ko":"어머니가 건강하셨으면 좋겠습니다."},"level":"N4"},{"id":"p0084","type":"pattern","script":"hiragana","display":"〜(ら)れる(수동)","meanings":["~받다","~당하다","~되다"],"example":{"text":"弟にケーキを食べられました。","reading":"おとうとにケーキをたべられました。","ko":"남동생이 케이크를 먹어 버렸습니다."},"level":"N4"},{"id":"p0085","type":"pattern","script":"hiragana","display":"〜(さ)せる(사역)","meanings":["~하게 하다","~시키다"],"example":{"text":"母は子供に野菜を食べさせます。","reading":"はははこどもにやさいをたべさせます。","ko":"어머니는 아이에게 채소를 먹게 합니다."},"level":"N4"},{"id":"p0086","type":"pattern","script":"hiragana","display":"〜(さ)せられる(사역수동)","meanings":["억지로 ~하다","마지못해 ~하다"],"example":{"text":"子供の時、母にピアノを習わせられました。","reading":"こどものとき、ははにピアノをならわせられました。","ko":"어렸을 때 어머니 때문에 억지로 피아노를 배웠습니다."},"level":"N4"},{"id":"p0087","type":"pattern","script":"hiragana","display":"〜(さ)せてください","meanings":["~하게 해 주세요"],"example":{"text":"少し休ませてください。","reading":"すこしやすませてください。","ko":"좀 쉬게 해 주세요."},"level":"N4"},{"id":"p0088","type":"pattern","script":"hiragana","display":"〜(ら)れる(가능)","meanings":["~할 수 있다"],"example":{"text":"私は刺身が食べられます。","reading":"わたしはさしみがたべられます。","ko":"저는 회를 먹을 수 있습니다."},"level":"N4"},{"id":"p0089","type":"pattern","script":"hiragana","display":"〜ことができる","meanings":["~할 수 있다"],"example":{"text":"この図書館では本を十冊借りることができます。","reading":"このとしょかんではほんをじゅっさつかりることができます。","ko":"이 도서관에서는 책을 열 권 빌릴 수 있습니다."},"level":"N4"},{"id":"p0090","type":"pattern","script":"hiragana","display":"お〜になる","meanings":["~하시다(존경)"],"example":{"text":"先生はもうお帰りになりました。","reading":"せんせいはもうおかえりになりました。","ko":"선생님은 벌써 돌아가셨습니다."},"level":"N4"},{"id":"p0091","type":"pattern","script":"hiragana","display":"お〜する","meanings":["~해 드리다(겸양)"],"example":{"text":"荷物をお持ちします。","reading":"にもつをおもちします。","ko":"짐을 들어 드리겠습니다."},"level":"N4"},{"id":"p0092","type":"pattern","script":"hiragana","display":"〜させていただく","meanings":["~하겠습니다(겸양)"],"example":{"text":"では、説明させていただきます。","reading":"では、せつめいさせていただきます。","ko":"그럼 설명하겠습니다."},"level":"N4"},{"id":"p0093","type":"pattern","script":"hiragana","display":"〜やすい","meanings":["~하기 쉽다","~하기 편하다"],"example":{"text":"このペンは書きやすいです。","reading":"このペンはかきやすいです。","ko":"이 펜은 쓰기 편합니다."},"level":"N4"},{"id":"p0094","type":"pattern","script":"hiragana","display":"〜にくい","meanings":["~하기 어렵다","~하기 힘들다"],"example":{"text":"この字は小さくて読みにくいです。","reading":"このじはちいさくてよみにくいです。","ko":"이 글씨는 작아서 읽기 어렵습니다."},"level":"N4"},{"id":"p0095","type":"pattern","script":"hiragana","display":"〜すぎる","meanings":["너무 ~하다","지나치게 ~하다"],"example":{"text":"昨日は食べすぎました。","reading":"きのうはたべすぎました。","ko":"어제는 너무 많이 먹었습니다."},"level":"N4"},{"id":"p0096","type":"pattern","script":"kanji","display":"〜方(かた)","meanings":["~하는 방법","~하는 법"],"example":{"text":"この漢字の読み方を教えてください。","reading":"このかんじのよみかたをおしえてください。","ko":"이 한자 읽는 법을 가르쳐 주세요."},"level":"N4"},{"id":"p0097","type":"pattern","script":"hiragana","display":"〜たがる","meanings":["~하고 싶어 하다"],"example":{"text":"子供は外で遊びたがっています。","reading":"こどもはそとであそびたがっています。","ko":"아이는 밖에서 놀고 싶어 합니다."},"level":"N4"},{"id":"p0098","type":"pattern","script":"hiragana","display":"〜がる","meanings":["~해하다","~하게 여기다"],"example":{"text":"妹は犬を怖がります。","reading":"いもうとはいぬをこわがります。","ko":"여동생은 개를 무서워합니다."},"level":"N4"},{"id":"p0099","type":"pattern","script":"hiragana","display":"〜さ(명사화)","meanings":["~함","~기(정도)"],"example":{"text":"この橋の長さは百メートルです。","reading":"このはしのながさはひゃくメートルです。","ko":"이 다리의 길이는 100미터입니다."},"level":"N4"},{"id":"p0100","type":"pattern","script":"hiragana","display":"〜たほうがいい","meanings":["~하는 편이 좋다","~하는 게 낫다"],"example":{"text":"早く病院へ行ったほうがいいですよ。","reading":"はやくびょういんへいったほうがいいですよ。","ko":"빨리 병원에 가는 게 좋아요."},"level":"N4"},{"id":"p0101","type":"pattern","script":"hiragana","display":"〜ないほうがいい","meanings":["~하지 않는 편이 좋다"],"example":{"text":"夜遅く食べないほうがいいです。","reading":"よるおそくたべないほうがいいです。","ko":"밤늦게 먹지 않는 편이 좋습니다."},"level":"N4"},{"id":"p0102","type":"pattern","script":"hiragana","display":"〜ばいい","meanings":["~하면 된다"],"example":{"text":"分からない時は、先生に聞けばいいです。","reading":"わからないときは、せんせいにきけばいいです。","ko":"모를 때는 선생님께 물으면 됩니다."},"level":"N4"},{"id":"p0103","type":"p const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const JONG_B = 17;

// 활용 어미 (긴 것부터 검사)
const ENDINGS = {
  ha: ['하였습니다', '했습니다', '합니다', '하였다', '했다', '해요', '하다', '하는', '하기', '한다', '한', '함', '해'],
  doe: ['되었습니다', '됐습니다', '됩니다', '되었다', '됐다', '돼요', '되요', '되다', '되는', '된다', '된', '됨', '돼'],
  ida: ['입니다', '이에요', '이다', '예요'],
  gen: ['었습니다', '았습니다', '습니다', '었다', '았다', '어요', '아요', '여요', '는다', '다', '요'],
};
const NEGATIONS = ['없', '않', '아니', '못', '안되', '안돼'];

function stripChars(s) {
  return s.replace(/[.,~〜!?！？·…'"“”‘’\-]/g, '').toLowerCase();
}

function normalize(s) {
  return stripChars(s.replace(/\(.*?\)|（.*?）/g, '')).replace(/\s+/g, '');
}

// 정규화 문자열과 함께, 원래 띄어쓰기 기준 단어 시작 위치를 돌려준다
function tokenStarts(s) {
  const tokens = stripChars(s.replace(/\(.*?\)|（.*?）/g, '')).split(/\s+/).filter(Boolean);
  const starts = new Set();
  let pos = 0;
  for (const t of tokens) { starts.add(pos); pos += t.length; }
  return starts;
}

function decompose(ch) {
  const code = ch.charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return null;
  return { cho: Math.floor(code / 588), jung: Math.floor((code % 588) / 28), jong: code % 28 };
}

function compose({ cho, jung, jong }) {
  return String.fromCharCode(0xac00 + cho * 588 + jung * 28 + jong);
}

function toJamo(s) {
  const out = [];
  for (const ch of s) {
    const d = decompose(ch);
    if (!d) { out.push(ch); continue; }
    out.push(CHO[d.cho], JUNG[d.jung]);
    if (d.jong) out.push(JONG[d.jong]);
  }
  return out;
}

// 어미를 떼어 낸 어간 후보들. 이다/입니다를 뗀 결과는 1글자면 버린다 (모이다 → 모 방지)
function stems(norm) {
  const out = new Set([norm]);
  for (const [group, list] of Object.entries(ENDINGS)) {
    for (const e of list) {
      if (norm.endsWith(e) && norm.length > e.length) {
        const stem = norm.slice(0, -e.length);
        if (group === 'ida' && stem.length < 2) continue;
        out.add(stem);
        break;
      }
    }
  }
  // ㅂ니다: 보냅니다 → 보내
  if (norm.endsWith('니다') && norm.length > 2) {
    const prev = decompose(norm[norm.length - 3]);
    if (prev && prev.jong === JONG_B) out.add(norm.slice(0, -3) + compose({ ...prev, jong: 0 }));
  }
  return [...out].filter(Boolean);
}

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return dp[a.length][b.length];
}

function hasNewNegation(input, meaning) {
  return NEGATIONS.some(n => input.includes(n) && !meaning.includes(n));
}

function matchOne(rawInput, rawMeaning, version) {
  const x = normalize(rawInput);
  const m = normalize(rawMeaning);
  if (!x || !m) return null;

  // 규칙 1: 정규화 후 일치
  if (x === m) return 'normalize';

  // 규칙 3: 어미 차이 허용
  const xs = stems(x);
  const ms = stems(m);
  if (xs.some(s => ms.includes(s))) return 'stem';

  // 규칙 4: 포함 일치
  if (version === 'v1') {
    if (ms.some(s => s.length >= 2 && x.includes(s))) return 'contains';
    if (xs.some(s => s.length >= 2 && m.includes(s))) return 'contains';
  } else {
    const starts = tokenStarts(rawInput);
    if (!hasNewNegation(x, m)) {
      // 입력이 정답 어간을 담고 있음: 띄어쓴 단어의 시작에서만 (불친절 ✕, 친절한 것 ○)
      for (const s of ms) {
        if (s.length < 2) continue;
        let i = x.indexOf(s);
        while (i !== -1) {
          if (starts.has(i)) return 'contains';
          i = x.indexOf(s, i + 1);
        }
      }
      // 정답이 입력을 담고 있음: 정답의 앞부분이고 절반 이상일 때만 (고장 ○, 자다 ✕)
      if (xs.some(s => s.length >= 2 && m.startsWith(s) && s.length / m.length >= 0.5)) return 'prefix';
    }
  }

  // 규칙 5: 오타 허용
  if (version === 'v1') {
    if (m.length >= 3 && levenshtein([...x], [...m]) <= 1) return 'typo';
  } else {
    if (toJamo(m).length >= 7) {
      const pairs = [[x, m], ...xs.flatMap(a => ms.map(b => [a, b]))];
      for (const [a, b] of pairs) {
        if (a.length < 2 || b.length < 2 || a[0] !== b[0]) continue; // 첫 글자는 같아야 함 (늦/늘, 간단/단단 방지)
        if (levenshtein(toJamo(a), toJamo(b)) <= 1) return 'typo';
      }
    }
  }
  return null;
}

function grade(input, meanings, version = 'v2') {
  for (const m of meanings) {
    const rule = matchOne(input, m, version);
    if (rule) return { ok: true, rule, meaning: m };
  }
  return { ok: false };
}

module.exports = { grade, normalize, stems };

window.Grader = module.exports;
})();
</script>
<script>
// JLPT 암기장 (PRD v0.6). 데이터(data.js)와 채점기(grade.js)는 node data/build.js 가 만든다.
(function () {
  'use strict';

  const DATA = window.JLPT_DATA;
  const RANGES = [
    { key: 'n4-vocab', label: 'N4 단어' },
    { key: 'n4-pattern', label: 'N4 문형' },
    { key: 'n5-review', label: 'N5 복습' },
  ];
  const COUNTS = [20, 50, 'all'];
  const ALL = RANGES.flatMap(r => DATA[r.key]);
  const KANJI = /[一-鿿々]/;

  // ---- 저장 (PRD 6.1) ----
  const STORE_KEY = 'jlpt-flashcards';
  const store = (() => {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { /* 저장소를 못 쓰면 빈 기록으로 시작 */ }
    return {
      progress: saved.progress || {},
      acceptedAnswers: saved.acceptedAnswers || {},
      settings: Object.assign({ range: ['n4-vocab'], count: 20 }, saved.settings),
    };
  })();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 무시 */ }
  }

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // ---- 도우미 ----
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = sel => app.querySelector(sel);

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const wrongNote = () => ALL.filter(it => store.progress[it.id] && store.progress[it.id].inWrongNote);
  const rangeItems = range => RANGES.filter(r => range.includes(r.key)).flatMap(r => DATA[r.key]);

  // 안 푼 문제 → 오답 이력 많은 문제 순, 같은 순위 안에서는 무작위 (PRD 4.6)
  function ordered(items) {
    const seen = it => (store.progress[it.id] ? 1 : 0);
    const wrongs = it => (store.progress[it.id] ? store.progress[it.id].wrong : 0);
    return shuffle(items.slice()).sort((a, b) => seen(a) - seen(b) || wrongs(b) - wrongs(a));
  }

  // 히라가나 버튼: 한자 단어는 단어·예문 읽기, 문형은 예문에 한자가 있을 때 예문 읽기
  function hasHint(item) {
    if (item.type === 'vocab') return item.script === 'kanji';
    return !!item.example && KANJI.test(item.example.text);
  }

  // ---- 상태 ----
  let phase = 'home'; // home | question | feedback | result
  let round = null;   // { items, index, wrong: [], correct, retry }
  let q = null;       // 지금 문제의 상태 { item, answer, ok, before }

  // ---- 홈 ----
  function renderHome() {
    phase = 'home';
    const s = store.settings;
    const pool = rangeItems(s.range);
    const learned = pool.filter(it => store.progress[it.id] && store.progress[it.id].correct > 0).length;
    const noteCount = wrongNote().length;
    app.innerHTML = `
      <section class="screen">
        <h1 class="title">JLPT N4 암기장</h1>
        <div>
          <div class="label">출제 범위</div>
          <div class="chips">
            ${RANGES.map(r => `<button class="chip" data-range="${r.key}" aria-pressed="${s.range.includes(r.key)}">${r.label}</button>`).join('')}
          </div>
        </div>
        <div>
          <div class="label">문제 수</div>
          <div class="chips">
            ${COUNTS.map(c => `<button class="chip" data-count="${c}" aria-pressed="${s.count === c}">${c === 'all' ? '전체' : c}</button>`).join('')}
          </div>
        </div>
        <div class="bottom">
          <button class="btn primary" id="start" ${s.range.length ? '' : 'disabled'}>시작하기</button>
          <button class="btn" id="note" ${noteCount ? '' : 'disabled'}>오답만 풀기 (${noteCount})</button>
          <p class="progress-line">학습한 항목 ${learned} / ${pool.length}</p>
        </div>
      </section>`;

    app.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.range;
      s.range = s.range.includes(k) ? s.range.filter(x => x !== k) : RANGES.map(r => r.key).filter(x => x === k || s.range.includes(x));
      save();
      renderHome();
      $(`[data-range="${k}"]`).focus();
    }));
    app.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => {
      s.count = b.dataset.count === 'all' ? 'all' : Number(b.dataset.count);
      save();
      renderHome();
      $(`[data-count="${b.dataset.count}"]`).focus();
    }));
    $('#start').addEventListener('click', () => {
      const items = ordered(rangeItems(s.range));
      startRound(s.count === 'all' ? items : items.slice(0, s.count), false);
    });
    $('#note').addEventListener('click', () => startRound(ordered(wrongNote()), false));
  }

  // ---- 라운드 ----
  function startRound(items, retry) {
    round = { items, index: 0, wrong: [], correct: 0, retry };
    renderQuestion();
  }

  const countText = () => `${round.retry ? '다시 풀기 · ' : ''}${round.index + 1} / ${round.items.length} · 오답 ${round.wrong.length}`;

  function renderQuestion() {
    phase = 'question';
    const item = round.items[round.index];
    q = { item, answer: null, ok: null, before: null };
    const reading = hasHint(item);
    const ex = item.example;
    const len = [...item.display].length;
    const size = len > 9 ? 'xlong' : len > 5 ? 'long' : '';

    app.innerHTML = `
      <section class="screen">
        <div class="topbar">
          <button class="btn link" id="home">← 홈</button>
          <span id="count">${countText()}</span>
        </div>
        <div class="card" id="card">
          <div class="q ${size}" lang="ja">${esc(item.display)}</div>
          ${item.type === 'vocab' && reading ? `<div class="reading hint" lang="ja" hidden>${esc(item.reading)}</div>` : ''}
          ${ex ? `
            <div class="example" lang="ja">${esc(ex.text)}</div>
            ${reading ? `<div class="reading hint" lang="ja" style="font-size:14px" hidden>${esc(ex.reading)}</div>` : ''}` : ''}
        </div>
        <div class="bottom">
          <input class="answer" id="answer" type="text" placeholder="한국어 뜻 입력" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
          <div id="controls">
            <div class="row">
              ${reading ? '<button class="btn" id="hint"><span lang="ja">あ</span> 히라가나</button>' : ''}
              <button class="btn" id="giveup">한국어 답</button>
            </div>
            <div class="row" style="margin-top:10px"><button class="btn primary" id="check">확인</button></div>
          </div>
        </div>
      </section>`;

    $('#home').addEventListener('click', renderHome);
    if (reading) $('#hint').addEventListener('click', () => {
      app.querySelectorAll('.hint').forEach(el => { el.hidden = false; });
      $('#hint').disabled = true;
      $('#answer').focus();
    });
    $('#giveup').addEventListener('click', () => finish(false, null));
    $('#check').addEventListener('click', submit);
    $('#answer').focus();
  }

  function submit() {
    const input = $('#answer');
    const answer = input.value.trim();
    if (!answer) {
      input.classList.remove('shake');
      void input.offsetWidth; // 애니메이션 다시 시작
      input.classList.add('shake');
      input.focus();
      return;
    }
    const meanings = q.item.meanings.concat(store.acceptedAnswers[q.item.id] || []);
    finish(window.Grader.grade(answer, meanings).ok, answer);
  }

  function finish(ok, answer) {
    const id = q.item.id;
    const p = store.progress[id] || { correct: 0, wrong: 0, lastSeen: '', inWrongNote: false };
    q.before = Object.assign({}, p);
    if (ok) { p.correct++; p.inWrongNote = false; } else { p.wrong++; p.inWrongNote = true; }
    p.lastSeen = today();
    store.progress[id] = p;
    save();

    q.ok = ok;
    q.answer = answer;
    if (ok) round.correct++; else round.wrong.push(q.item);
    renderFeedback();
  }

  function renderFeedback() {
    phase = 'feedback';
    $('#count').textContent = countText();
    const { item, ok, answer } = q;
    const ex = item.example;
    const reading = item.type === 'vocab' && item.script === 'kanji' ? item.reading : null;
    const card = $('#card');
    card.className = 'card ' + (ok ? 'ok' : 'ng');
    card.innerHTML = `
      <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '✓ 정답' : '✗ 오답'}</div>
      <div class="q ${$('.q').className.replace('q', '').trim()}" lang="ja">${esc(item.display)}</div>
      ${reading ? `<div class="reading" lang="ja">${esc(reading)}</div>` : ''}
      <dl class="facts">
        ${!ok && answer ? `<dt>내 답</dt><dd class="mine">${esc(answer)}</dd>` : ''}
        <dt>정답</dt><dd>${esc(item.meanings.join(' · '))}</dd>
        ${ex ? `<dt>예문</dt><dd><div class="jp" lang="ja">${esc(ex.text)}</div><div class="reading" lang="ja" style="font-size:14px">${esc(ex.reading)}</div><div class="example-ko">${esc(ex.ko)}</div></dd>` : ''}
      </dl>`;
    const input = $('#answer');
    input.readOnly = true; // 포커스는 그대로 두어 모바일 키보드가 닫히지 않게 하고, 엔터로 다음으로 넘어간다
    $('#controls').innerHTML = `
      ${!ok && answer ? '<div class="row" style="margin-bottom:10px"><button class="btn" id="mine">내 답도 맞음</button></div>' : ''}
      <div class="row"><button class="btn primary" id="next">다음</button></div>`;
    $('#next').addEventListener('click', next);
    if (!ok && answer) $('#mine').addEventListener('click', acceptMine);
    input.focus();
  }

  // [내 답도 맞음]: 정답으로 바꾸고, 그 입력을 허용 답으로 저장 (PRD 4.3)
  function acceptMine() {
    const id = q.item.id;
    const p = store.progress[id];
    p.correct = q.before.correct + 1;
    p.wrong = q.before.wrong;
    p.inWrongNote = false;
    const list = store.acceptedAnswers[id] || (store.acceptedAnswers[id] = []);
    if (!list.includes(q.answer)) list.push(q.answer);
    save();
    round.wrong.pop();
    round.correct++;
    next();
  }

  function next() {
    round.index++;
    if (round.index < round.items.length) renderQuestion();
    else renderResult();
  }

  // ---- 라운드 결과 (PRD 4.7) ----
  function renderResult() {
    phase = 'result';
    const { wrong, correct, items } = round;
    app.innerHTML = `
      <section class="screen">
        <div class="score">${correct} / ${items.length}</div>
        <p class="progress-line">${wrong.length ? `오답 ${wrong.length}개 · 다 맞힐 때까지 다시 풀어요` : '모두 맞혔어요'}</p>
        ${wrong.length ? `<ul class="wrong-list">${wrong.map(it => `
          <li>
            <span class="w-disp" lang="ja">${esc(it.display)}</span>
            ${it.type === 'vocab' && it.script === 'kanji' ? `<span class="w-read" lang="ja">${esc(it.reading)}</span>` : ''}
            <span class="w-mean">${esc(it.meanings.join(' · '))}</span>
          </li>`).join('')}</ul>` : ''}
        <div class="bottom">
          ${wrong.length ? '<button class="btn primary" id="retry">오답 다시 풀기</button>' : ''}
          <button class="btn ${wrong.length ? '' : 'primary'}" id="home">홈으로</button>
        </div>
      </section>`;
    if (wrong.length) $('#retry').addEventListener('click', () => startRound(shuffle(wrong.slice()), true));
    $('#home').addEventListener('click', renderHome);
    (wrong.length ? $('#retry') : $('#home')).focus();
  }

  // ---- 키보드: 엔터로 확인 → 엔터로 다음 ----
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (e.target.tagName === 'BUTTON') return; // 포커스된 버튼은 기본 동작(클릭)
    if (phase === 'question' && e.target.id === 'answer') { e.preventDefault(); submit(); }
    else if (phase === 'feedback') { e.preventDefault(); next(); }
  });

  renderHome();
})();
</script>
</body>
</html>
